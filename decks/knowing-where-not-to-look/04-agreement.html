<section>
  <h2>Why agreement is not confidence</h2>
  <p>Self-consistency and semantic entropy ask the same question several times and count agreement.
  That measures the agent's habits, not the truth.</p>
  <figure><img alt="Proposal and target distributions over answer paths">
  <figcaption>On a rare passage the samples miss the correct route; on a ghost passage there is none to miss.</figcaption></figure>
  <aside class="notes">Every sample can agree on a wrong answer, and the variance looks fine. It fails silently.</aside>
</section>
