[project]
name = "lectern"
version = "0.4.1"
description = "A small presenter wrapper: every slide of a deck gets its own question-answering agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "mcp>=1.20",
    "pydantic>=2.14.3",
    "pypdf>=5",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
lectern = "lectern.cli:main"

[project.optional-dependencies]
s3 = [
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/lectern"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # "a b c".split() reads better than a long list literal

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["lectern"]

[[tool.mypy.overrides]]
module = ["pptx", "pptx.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
